<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Obra Directa</title>
<meta name="theme-color" content="#ff6a00">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<style>
:root{--or:#ff6a00;--or2:#ff8f3d;--ink:#1b1f2a;--mu:#667085;--bg:#fff;--soft:#fff4ea;--line:#f1e1d1;--ok:#16a34a;--no:#dc2626}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,sans-serif;min-height:100dvh}
#app{max-width:560px;margin:auto;padding:0 16px 96px}
.stripes{height:14px;background:repeating-linear-gradient(-45deg,var(--or) 0 14px,#fff 14px 28px);margin:0 -16px}
.top{display:flex;align-items:center;gap:10px;padding:14px 0}
.top img{width:38px}.top b{font-size:20px;letter-spacing:-.3px}.top b span{color:var(--or)}
h1{font-size:34px;line-height:1.1;letter-spacing:-1px;margin:6px 0 10px}h1 em{font-style:normal;color:var(--or)}
h2{font-size:20px;margin:0 0 10px;letter-spacing:-.3px}h3{font-size:16px;margin-bottom:4px}
p.lead{font-size:18px;color:var(--mu);margin-bottom:16px}
@keyframes up{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes wob{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes pop{0%{transform:scale(.8);opacity:0}100%{transform:none;opacity:1}}
.up{animation:up .5s both}
.hero{display:flex;gap:10px;align-items:center}
.hero svg{width:96px;flex:none;animation:wob 3.5s ease-in-out infinite;transform-origin:50% 90%}
.box{background:#fff;border:1px solid var(--line);border-radius:20px;padding:16px;margin-bottom:14px;box-shadow:0 4px 18px #ff6a000d;animation:up .4s both}
.box.or{background:var(--soft)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:430px){.two.r{grid-template-columns:1fr}}
.who{border:2px solid var(--line);border-radius:20px;padding:16px;background:#fff;transition:transform .2s,border-color .2s}
.who:hover{transform:translateY(-3px);border-color:var(--or)}
.who ul{list-style:none;padding:0;margin:8px 0 14px;font-size:14px;color:var(--mu)}.who li{padding:3px 0 3px 22px;position:relative}
.who li:before{content:"✓";position:absolute;left:0;color:var(--or);font-weight:800}
label{display:block;color:var(--mu);font-size:13px;margin:12px 0 5px;font-weight:600}
input,select,textarea{width:100%;background:#fff;border:1.5px solid #e6d9cc;color:var(--ink);border-radius:12px;padding:12px;font:inherit}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--or);box-shadow:0 0 0 4px #ff6a001f}
button{font:inherit;border:0;border-radius:14px;padding:13px 18px;color:#fff;font-weight:700;background:var(--or);cursor:pointer;transition:transform .15s,box-shadow .2s,background .2s}
button:hover{background:#f05f00;box-shadow:0 6px 18px #ff6a0040}button:active{transform:scale(.96)}
button.g{background:#fff;color:var(--ink);border:1.5px solid #e6d9cc}button.g:hover{background:var(--soft);box-shadow:none}
button.ok{background:var(--ok)}button.no{background:#fff;color:var(--no);border:1.5px solid #f3c2c2}
button.w{width:100%}
.row{display:flex;gap:10px}.row>*{flex:1}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:8px 14px;border-radius:99px;border:1.5px solid #e6d9cc;background:#fff;cursor:pointer;font-size:14px;font-weight:600;user-select:none;transition:all .15s}
.chip.on{background:var(--or);border-color:var(--or);color:#fff;animation:pop .2s}
.tag{display:inline-block;padding:3px 10px;border-radius:99px;background:var(--soft);color:#c2410c;font-size:13px;font-weight:600;margin:0 6px 6px 0}
.tag.b{background:#e8f7ee;color:#15803d}
.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;gap:6px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:#fffffff2;backdrop-filter:blur(10px);border-top:1px solid var(--line)}
.tabs button{flex:1;max-width:150px;background:#fff;color:var(--mu);border:1.5px solid transparent;padding:11px 8px;font-size:14px}
.tabs button.on{background:var(--or);color:#fff}
.bar{height:10px;border-radius:9px;background:#f4e7da;overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;background:repeating-linear-gradient(-45deg,var(--or) 0 10px,var(--or2) 10px 20px);border-radius:9px;transition:width .5s}
.todo{font-size:14px;color:var(--mu);display:flex;flex-wrap:wrap;gap:6px 14px}.todo .d{color:var(--ok);font-weight:700}
.deck{position:relative;height:590px;margin:10px 0 14px}
.card{position:absolute;inset:0;background:#fff;border:1px solid var(--line);border-radius:24px;overflow:hidden;touch-action:pan-y;user-select:none;box-shadow:0 14px 40px #1b1f2a1f}
.card .ph{height:52%;background:#fff4ea center/cover;position:relative;display:flex;align-items:center;justify-content:center;font-size:54px}
.card .dots{position:absolute;top:10px;left:0;right:0;display:flex;gap:4px;padding:0 12px}.dots i{flex:1;height:4px;border-radius:4px;background:#ffffffaa}.dots i.on{background:#fff}
.card .in{padding:14px 16px}
.stamp{position:absolute;top:24px;font-size:26px;font-weight:900;border:4px solid;border-radius:12px;padding:2px 12px;opacity:0;background:#fffc}
.stamp.l{left:18px;color:var(--ok);transform:rotate(-12deg)}.stamp.n{right:18px;color:var(--no);transform:rotate(12deg)}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}.thumbs div{position:relative}
.thumbs img{width:84px;height:84px;object-fit:cover;border-radius:12px}
.thumbs b{position:absolute;top:3px;right:3px;background:#000a;color:#fff;border-radius:99px;width:22px;height:22px;text-align:center;cursor:pointer;font-size:14px;line-height:22px}
.add{width:84px;height:84px;border:2px dashed var(--or);border-radius:12px;display:flex;align-items:center;justify-content:center;color:var(--or);font-size:30px;cursor:pointer;background:var(--soft)}
.mu{color:var(--mu);font-size:14px}.st{color:#f59e0b}
.msg{padding:11px 13px;border-radius:12px;background:#1b1f2a;color:#fff;margin:10px 0;font-size:14px;animation:up .3s both}
.steps{counter-reset:s}.steps li{list-style:none;position:relative;padding:4px 0 12px 46px}
.steps li:before{counter-increment:s;content:counter(s);position:absolute;left:0;top:0;width:34px;height:34px;border-radius:50%;background:var(--or);color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center}
.sample{pointer-events:none;transform:rotate(-2deg);max-width:300px;margin:6px auto 0}
.sample .ph{height:120px;background:linear-gradient(135deg,#ffd9bd,#ffb27a);display:flex;align-items:center;justify-content:center;font-size:46px}
.sample .card{position:relative;inset:auto;height:auto;box-shadow:0 14px 34px #ff6a0033}
small.f{display:block;text-align:center;color:var(--mu);font-size:12px;margin:18px 0}
a{color:#c2410c}
.pro{display:flex;gap:8px;flex-wrap:wrap}
.tg{display:flex;align-items:center;gap:10px;padding:10px 0;font-weight:600;font-size:15px}.tg input{width:22px;height:22px;accent-color:var(--or)}
</style>
</head>
<body>
<div id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script>
const TRADES=['Albañil','Pintor','Fontanero','Electricista','Pladur','Alicatador','Carpintero','Yesero','Encofrador','Peón'];
const SKILLS={'Albañil':['Reformas','Tabiques','Obra nueva','Rehabilitación','Fachadas','Cubiertas'],'Pintor':['Interior','Exterior','Lacado','Estuco','Gotelé','Fachadas'],'Fontanero':['Baños','Cocinas','Calefacción','Gas','Saneamiento','Urgencias'],'Electricista':['Instalación','Boletín','Cuadros','Iluminación','Domótica','Urgencias'],'Pladur':['Tabiques','Techos','Aislamientos','Reformas'],'Alicatador':['Baños','Cocinas','Suelos','Microcemento'],'Carpintero':['Puertas','Armarios','Tarimas','Estructuras'],'Yesero':['Enlucidos','Guarnecidos','Techos'],'Encofrador':['Cimentación','Muros','Forjados'],'Peón':['Ayudante','Limpieza de obra','Carga y descarga','Demolición']};
const KINDS=['Constructora','Empresa de reformas','Promotora','Instalaciones','Administrador de fincas','Otro'];
const $=s=>document.querySelector(s),app=$('#app');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const opts=(l,sel)=>l.map(t=>`<option ${t===sel?'selected':''}>${esc(t)}</option>`).join('');
const stars=n=>n?`<span class="st">${'★'.repeat(Math.round(n))}${'☆'.repeat(5-Math.round(n))}</span> <b>${n.toFixed(1)}</b>`:'<span class="mu">Sin valoraciones todavía</span>';
const chips=(list,sel)=>`<div class="chips">`+list.map(t=>`<span class="chip ${sel.includes(t)?'on':''}" data-v="${esc(t)}">${esc(t)}</span>`).join('')+`</div>`;
const picked=el=>[...el.querySelectorAll('.chip.on')].map(c=>c.dataset.v);
function bindChips(el,single,cb){el.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{if(single)el.querySelectorAll('.chip').forEach(x=>x.classList.remove('on'));c.classList.toggle('on',single?true:!c.classList.contains('on'));cb&&cb()})}
let sb,S={user:null,role:null,me:null,tab:null},F={trade:'Todos',zone:''};
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
const CONE=`<svg viewBox="0 0 100 120"><ellipse cx="50" cy="112" rx="44" ry="7" fill="#1b1f2a22"/><rect x="6" y="96" width="88" height="14" rx="4" fill="#1b1f2a"/><path d="M38 12h24l22 84H16z" fill="#ff6a00"/><path d="M33 34h34l4 15H29z M26 60h48l4 16H22z" fill="#fff"/><rect x="38" y="8" width="24" height="8" rx="4" fill="#ff8f3d"/></svg>`;
const hdr=()=>`<div class="stripes"></div><div class="top"><img src="icon.svg" alt=""><b>Obra<span>Directa</span></b></div>`;
function say(t){const m=document.createElement('div');m.className='msg';m.textContent=t;const v=$('#v')||app;v.prepend(m);window.scrollTo({top:0,behavior:'smooth'});setTimeout(()=>m.remove(),5000)}

async function boot(){
  if(!CFG.URL||!CFG.KEY){app.innerHTML=hdr()+`<div class="box"><h2>Falta configurar</h2><p class="mu">Rellena config.js con la URL y la clave pública.</p></div>`;return}
  sb=supabase.createClient(CFG.URL,CFG.KEY);
  const {data:{session}}=await sb.auth.getSession();
  if(!session)return landing();
  S.user=session.user;await loadRole();
}
function landing(){
  app.innerHTML=hdr()+`
  <div class="hero up"><div><h1>Autónomos de obra, <em>sin intermediarios</em></h1></div>${CONE}</div>
  <p class="lead up">La web donde las empresas de construcción encuentran autónomos de confianza en el Vallès, y los autónomos consiguen trabajo enseñando lo que saben hacer.</p>
  <div class="two r up">
    <div class="who"><h2>🔨 Soy autónomo</h2><ul><li>Crea tu perfil con fotos de tus obras</li><li>Las empresas te encuentran y te avisan</li><li>Recibes valoraciones reales</li><li>Gratis, siempre</li></ul><button class="w" data-go="a">Crear mi perfil</button></div>
    <div class="who"><h2>🏗 Soy empresa</h2><ul><li>Mira perfiles con fotos y valoraciones</li><li>Filtra por oficio y zona</li><li>Marca los que te gustan y llámalos</li><li>Empieza gratis</li></ul><button class="w" data-go="e">Buscar autónomos</button></div>
  </div>
  <h2 style="margin-top:26px">Cómo funciona</h2>
  <ol class="steps box or"><li><b>El autónomo se registra</b><br><span class="mu">Sube fotos de sus trabajos y se crea un mini currículum en 3 minutos.</span></li><li><b>La empresa busca y marca</b><br><span class="mu">Ve tarjetas con fotos, oficio, valoraciones y disponibilidad. Marca las que le gustan.</span></li><li><b>Si hay interés, se conocen</b><br><span class="mu">El autónomo acepta y se enseñan los teléfonos. Después, la empresa lo valora.</span></li></ol>
  <div class="sample"><div class="card"><div class="ph">🧱</div><div class="in"><span class="tag" style="background:#1b1f2a;color:#fff">EJEMPLO</span><h3>Carlos M.</h3><span class="tag">Albañil</span><span class="tag">Sabadell</span><span class="tag">12 años</span><p><span class="st">★★★★★</span> <b>4.8</b></p><span class="tag b">De alta</span><span class="tag b">Con seguro</span></div></div></div>
  <div class="box" style="margin-top:22px"><h3>¿Por qué esta web?</h3><p class="mu">Faltan miles de trabajadores en la construcción y hoy se contrata por WhatsApp y boca a boca. Aquí ves el trabajo real de cada profesional antes de llamar.</p></div>
  <button class="g w" data-go="in">Ya tengo cuenta</button>
  <small class="f">Obra Directa solo pone en contacto. La contratación y las condiciones son entre empresa y autónomo.</small>`;
  app.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>b.dataset.go==='in'?authView('in'):authView('up',b.dataset.go));
}
function authView(mode,role='a'){
  app.innerHTML=hdr()+`<div class="box"><button class="g" id="bk" style="padding:8px 12px;margin-bottom:8px">← Volver</button><h2>${mode==='in'?'Entrar':role==='a'?'Crea tu perfil de autónomo':'Crea tu cuenta de empresa'}</h2>
  ${mode==='up'?`<div class="row" style="margin-bottom:4px"><button class="${role==='a'?'':'g'}" id="ra">Autónomo</button><button class="${role==='e'?'':'g'}" id="re">Empresa</button></div><label>${role==='a'?'Tu nombre':'Nombre de la empresa'}</label><input id="nm" placeholder="${role==='a'?'Ej: Carlos Martínez':'Ej: Reformas Vallès S.L.'}">`:''}
  <label>Correo</label><input id="em" type="email" autocomplete="email" placeholder="tucorreo@ejemplo.com">
  <label>Contraseña (mínimo 6)</label><input id="pw" type="password" autocomplete="${mode==='in'?'current-password':'new-password'}">
  <button class="w" id="go" style="margin-top:16px">${mode==='in'?'Entrar':'Crear cuenta'}</button>
  <button class="g w" id="sw" style="margin-top:8px">${mode==='in'?'No tengo cuenta':'Ya tengo cuenta'}</button></div>`;
  $('#bk').onclick=landing;
  if(mode==='up'){$('#ra').onclick=()=>authView('up','a');$('#re').onclick=()=>authView('up','e')}
  $('#sw').onclick=()=>authView(mode==='in'?'up':'in',role);
  $('#go').onclick=async()=>{
    const email=$('#em').value.trim(),password=$('#pw').value;
    if(!email||password.length<6)return say('Escribe tu correo y una contraseña de 6 o más caracteres.');
    const r=mode==='in'?await sb.auth.signInWithPassword({email,password}):await sb.auth.signUp({email,password,options:{data:{role,name:$('#nm').value.trim()}}});
    if(r.error)return say(r.error.message);
    if(!r.data.session)return say('Cuenta creada. Revisa tu correo para confirmarla y luego entra.');
    S.user=r.data.user;loadRole();
  };
}
async function loadRole(){
  const id=S.user.id,md=S.user.user_metadata||{};
  let {data:p}=await sb.from('profiles').select('*').eq('id',id).maybeSingle();
  if(p){S.role='a';S.me=p;S.tab='perfil';return nav()}
  let {data:c}=await sb.from('companies').select('*').eq('id',id).maybeSingle();
  if(c){S.role='e';S.me=c;S.tab='buscar';return nav()}
  if(md.role==='e'){const r=await sb.from('companies').insert({id,name:md.name||'Mi empresa'}).select().single();S.role='e';S.me=r.data;S.tab='empresa'}
  else{const r=await sb.from('profiles').insert({id,name:md.name||'Autónomo'}).select().single();S.role='a';S.me=r.data;S.tab='perfil'}
  nav();
}
function nav(){
  const t=S.role==='a'?[['perfil','Mi perfil'],['avisos','Avisos']]:[['buscar','Buscar'],['contactos','Contactos'],['empresa','Empresa']];
  app.innerHTML=hdr()+'<div id="v"></div><div class="tabs">'+t.map(([k,n])=>`<button class="${S.tab===k?'on':''}" data-k="${k}">${n}</button>`).join('')+'<button id="out">Salir</button></div>';
  app.querySelectorAll('.tabs [data-k]').forEach(b=>b.onclick=()=>{S.tab=b.dataset.k;nav()});
  $('#out').onclick=async()=>{await sb.auth.signOut();S={user:null};landing()};
  ({perfil,avisos,buscar,contactos,empresa})[S.tab]();
}
async function getPhone(uid){const {data}=await sb.from('contacts').select('phone').eq('user_id',uid).maybeSingle();return data?.phone||''}
function progress(items){const d=items.filter(i=>i[1]).length,p=Math.round(d/items.length*100);
  return `<div class="box or"><h2>${p===100?'Perfil completo 🎉':'Completa tu perfil'}</h2><div class="bar"><i style="width:${p}%"></i></div><div class="todo">${items.map(i=>`<span class="${i[1]?'d':''}">${i[1]?'✓':'○'} ${i[0]}</span>`).join('')}</div></div>`}
function toggles(list){return list.map(([id,t,v])=>`<label class="tg"><input type="checkbox" id="${id}" ${v?'checked':''}> ${t}</label>`).join('')}

async function perfil(){
  const p=S.me,phone=await getPhone(S.user.id);S.phone=phone;
  const prog=()=>progress([['Foto de tus trabajos',(S.me.photos||[]).length>=1],['Oficio',!!S.me.trade],['Qué sabes hacer',(S.me.skills||[]).length>0],['Presentación',(S.me.bio||'').length>20],['Teléfono',!!S.phone]]);
  $('#v').innerHTML=`<div id="pg">${prog()}</div>
  <div class="box"><h2>1. Quién eres</h2>
   <label>Nombre</label><input id="n" value="${esc(p.name)}" placeholder="Ej: Carlos Martínez">
   <label>Tu oficio principal</label><div id="tr">${chips(TRADES,[p.trade])}</div>
   <div class="row"><div><label>Años de experiencia</label><input id="y" type="number" min="0" max="60" value="${p.years||0}"></div><div><label>Zona de trabajo</label><input id="z" value="${esc(p.zone)}" placeholder="Ej: Sabadell, Terrassa"></div></div></div>
  <div class="box"><h2>2. Qué sabes hacer</h2><p class="mu">Marca todo lo que haces.</p><div id="sk" style="margin-top:8px"></div></div>
  <div class="box"><h2>3. Cómo trabajas</h2>
   <label>Tu tarifa orientativa</label><input id="r" value="${esc(p.rate||'')}" placeholder="Ej: 18 €/hora o 150 € al día">
   ${toggles([['rg','Estoy dado de alta como autónomo',p.registered],['ins','Tengo seguro de responsabilidad civil',p.insured],['van','Tengo furgoneta',p.has_van],['tl','Llevo mi propia herramienta',p.own_tools],['av','Estoy disponible ahora',p.available]])}</div>
  <div class="box"><h2>4. Preséntate</h2><textarea id="b" rows="4" maxlength="400" placeholder="Ej: 15 años en reformas de baños y cocinas. Trabajo limpio y puntual. Me incorporo en 48 horas.">${esc(p.bio)}</textarea></div>
  <div class="box"><h2>5. Fotos de tus trabajos</h2><p class="mu">Es lo que más mira la empresa. Sube al menos 3 de obras terminadas.</p><div class="thumbs" id="th" style="margin-top:10px"></div><input id="f" type="file" accept="image/*" multiple hidden></div>
  <div class="box"><h2>6. Contacto</h2><label>Teléfono (solo lo ve quien tú aceptes)</label><input id="ph" type="tel" value="${esc(phone)}" placeholder="Ej: 600 123 456"></div>
  <button class="w" id="sv">Guardar mi perfil</button>`;
  const drawSk=()=>{const t=picked($('#tr'))[0]||S.me.trade;$('#sk').innerHTML=chips(SKILLS[t]||[],S.me.skills||[]);bindChips($('#sk'))};
  bindChips($('#tr'),true,drawSk);drawSk();
  const draw=()=>{$('#th').innerHTML=(S.me.photos||[]).map((u,i)=>`<div><img src="${esc(u)}" alt=""><b data-i="${i}">×</b></div>`).join('')+'<div class="add" id="ad">+</div>';
    $('#ad').onclick=()=>$('#f').click();
    $('#th').querySelectorAll('b').forEach(b=>b.onclick=async()=>{const ph=[...S.me.photos];const [u]=ph.splice(+b.dataset.i,1);const path=u.split('/fotos/')[1];if(path)await sb.storage.from('fotos').remove([path]);await sb.from('profiles').update({photos:ph}).eq('id',S.user.id);S.me.photos=ph;draw();$('#pg').innerHTML=prog()})};draw();
  $('#f').onchange=async e=>{for(const f of e.target.files){
      if((S.me.photos||[]).length>=8){say('Máximo 8 fotos.');break}
      const blob=await shrink(f),path=`${S.user.id}/${Date.now()}.jpg`;
      const up=await sb.storage.from('fotos').upload(path,blob,{contentType:'image/jpeg'});if(up.error){say(up.error.message);continue}
      const url=sb.storage.from('fotos').getPublicUrl(path).data.publicUrl;const ph=[...(S.me.photos||[]),url];
      await sb.from('profiles').update({photos:ph}).eq('id',S.user.id);S.me.photos=ph;draw();$('#pg').innerHTML=prog()}e.target.value=''};
  $('#sv').onclick=async()=>{
    const row={name:$('#n').value.trim()||'Autónomo',trade:picked($('#tr'))[0]||'Albañil',zone:$('#z').value.trim()||'Vallès',years:+$('#y').value||0,bio:$('#b').value.trim(),skills:picked($('#sk')),rate:$('#r').value.trim(),registered:$('#rg').checked,insured:$('#ins').checked,has_van:$('#van').checked,own_tools:$('#tl').checked,available:$('#av').checked};
    const a=await sb.from('profiles').update(row).eq('id',S.user.id);const tel=$('#ph').value.trim();
    const b=tel?await sb.from('contacts').upsert({user_id:S.user.id,phone:tel}):{};
    if(a.error||b.error)return say((a.error||b.error).message+' (¿has ejecutado migracion-2.sql?)');
    Object.assign(S.me,row);S.phone=tel;$('#pg').innerHTML=prog();say('Perfil guardado.')};
}
function shrink(file){return new Promise((res,rej)=>{const i=new Image();i.onload=()=>{const k=Math.min(1,900/Math.max(i.width,i.height));const c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);c.toBlob(b=>b?res(b):rej(),'image/jpeg',.75)};i.onerror=rej;i.src=URL.createObjectURL(file)})}

async function empresa(){
  const c=S.me,phone=await getPhone(S.user.id);S.phone=phone;
  const prog=()=>progress([['Nombre',!!S.me.name],['Qué buscas',(S.me.looking_for||[]).length>0],['Trabajo que ofreces',(S.me.job||'').length>10],['REA',!!S.me.rea],['Teléfono',!!S.phone]]);
  $('#v').innerHTML=`<div id="pg">${prog()}</div>
  <div class="box"><h2>1. Tu empresa</h2><label>Nombre</label><input id="n" value="${esc(c.name)}" placeholder="Ej: Reformas Vallès S.L.">
   <label>Tipo de empresa</label><select id="k">${opts(KINDS,c.kind)}</select>
   <label>Zona donde trabajáis</label><input id="z" value="${esc(c.zone||'Vallès')}" placeholder="Ej: Vallès Occidental"></div>
  <div class="box"><h2>2. A quién buscas</h2><p class="mu">Marca los oficios que necesitas.</p><div id="lf" style="margin-top:8px">${chips(TRADES,c.looking_for||[])}</div></div>
  <div class="box"><h2>3. Trabajo que ofreces</h2><p class="mu">Los autónomos lo verán al recibir tu aviso.</p><textarea id="j" rows="4" maxlength="400" placeholder="Ej: Reforma integral de piso en Sabadell. 3 semanas. Empezamos el día 15. Pago a 15 días.">${esc(c.job)}</textarea></div>
  <div class="box"><h2>4. Sobre vosotros</h2><textarea id="ab" rows="3" maxlength="300" placeholder="Ej: 20 años en el sector. 12 trabajadores. Siempre pagamos a tiempo.">${esc(c.about)}</textarea></div>
  <div class="box"><h2>5. Confianza y contacto</h2><label>Número de REA (Registro de Empresas Acreditadas)</label><input id="r" value="${esc(c.rea)}" placeholder="Ej: 08/12345678">
   <label>Teléfono (solo lo ven los autónomos que acepten)</label><input id="ph" type="tel" value="${esc(phone)}" placeholder="Ej: 93 123 45 67"></div>
  <button class="w" id="sv">Guardar mi empresa</button>
  <small class="f">Obra Directa solo pone en contacto. La contratación, el pago y las condiciones son entre empresa y autónomo.</small>`;
  bindChips($('#lf'));
  $('#sv').onclick=async()=>{const row={name:$('#n').value.trim()||'Mi empresa',kind:$('#k').value,zone:$('#z').value.trim()||'Vallès',looking_for:picked($('#lf')),job:$('#j').value.trim(),about:$('#ab').value.trim(),rea:$('#r').value.trim()};
    const a=await sb.from('companies').update(row).eq('id',S.user.id);const tel=$('#ph').value.trim();
    const b=tel?await sb.from('contacts').upsert({user_id:S.user.id,phone:tel}):{};
    if(a.error||b.error)return say((a.error||b.error).message+' (¿has ejecutado migracion-2.sql?)');
    Object.assign(S.me,row);S.phone=tel;$('#pg').innerHTML=prog();say('Empresa guardada.')};
}

async function avisos(){
  const {data=[]}=await sb.from('likes').select('*, companies(name,rea,kind,zone,job)').eq('autonomo_id',S.user.id).order('created_at',{ascending:false});
  let html='<h2 style="margin-top:8px">Empresas interesadas</h2>';
  if(!data.length)html+=`<div class="box or"><h3>Todavía no hay avisos</h3><p class="mu">Cuando una empresa te marque, aparecerá aquí. Para que te encuentren antes: sube 3 fotos o más, marca lo que sabes hacer y pon que estás disponible.</p></div>`;
  for(const l of data){const c=l.companies||{};let ex='';
    if(l.status==='pending')ex=`<div class="row" style="margin-top:10px"><button class="ok" data-a="${l.company_id}">Aceptar</button><button class="no" data-d="${l.company_id}">Rechazar</button></div>`;
    else if(l.status==='accepted'){const ph=await getPhone(l.company_id);ex=`<p style="margin-top:8px"><b>Teléfono:</b> ${ph?`<a href="tel:${esc(ph)}">${esc(ph)}</a>`:'<span class="mu">no lo ha puesto</span>'}</p>`}
    else ex='<p class="mu" style="margin-top:6px">Rechazada</p>';
    html+=`<div class="box"><h3>${esc(c.name)}</h3><span class="tag">${esc(c.kind||'Empresa')}</span>${c.zone?`<span class="tag">${esc(c.zone)}</span>`:''}${c.rea?`<span class="tag b">REA ${esc(c.rea)}</span>`:''}<p class="mu">${esc(c.job||'Te ha marcado como interesante.')}</p>${ex}</div>`}
  $('#v').innerHTML=html;
  const ans=async(id,s)=>{await sb.from('likes').update({status:s}).eq('company_id',id).eq('autonomo_id',S.user.id);avisos()};
  $('#v').querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>ans(b.dataset.a,'accepted'));
  $('#v').querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>ans(b.dataset.d,'declined'));
}

async function buscar(){
  $('#v').innerHTML=`<div class="chips" id="ft" style="margin:4px 0 10px">${chips(['Todos',...TRADES],[F.trade]).replace('<div class="chips">','').replace(/<\/div>$/,'')}</div><input id="fz" placeholder="Zona (ej: Sabadell)" value="${esc(F.zone)}"><div class="deck" id="dk"></div><div class="row" id="bt"><button class="no" id="skip">✕ Pasar</button><button class="ok" id="like">♥ Me interesa</button></div>`;
  bindChips($('#ft'),true,()=>{F.trade=picked($('#ft'))[0]||'Todos';buscar()});
  $('#fz').onchange=e=>{F.zone=e.target.value.trim();buscar()};
  const mine=(await sb.from('likes').select('autonomo_id').eq('company_id',S.user.id)).data||[];
  const seen=new Set([...mine.map(m=>m.autonomo_id),...(S.skipped||[])]);
  let q=sb.from('profiles').select('*').eq('available',true).limit(60);
  if(F.trade!=='Todos')q=q.eq('trade',F.trade);if(F.zone)q=q.ilike('zone','%'+F.zone+'%');
  const list=((await q).data||[]).filter(p=>!seen.has(p.id));
  const rv=list.length?(await sb.from('reviews').select('autonomo_id,stars').in('autonomo_id',list.map(p=>p.id))).data||[]:[];
  list.forEach(p=>{const r=rv.filter(x=>x.autonomo_id===p.id);p.avg=r.length?r.reduce((a,x)=>a+x.stars,0)/r.length:0;p.n=r.length;p.i=0});
  const dk=$('#dk');
  const act=async like=>{const p=list.shift();if(!p)return;
    if(like){const r=await sb.from('likes').insert({company_id:S.user.id,autonomo_id:p.id,job:S.me.job||''});if(r.error)say(r.error.message)}else(S.skipped=S.skipped||[]).push(p.id);show()};
  function show(){
    const p=list[0];
    if(!p){dk.style.height='auto';dk.innerHTML=`<div class="box or"><h3>No hay más perfiles ahora mismo</h3><p class="mu">Prueba otro oficio o quita la zona. Entran autónomos nuevos cada semana.</p></div>`;$('#bt').style.display='none';return}
    $('#bt').style.display='';const ph=p.photos||[];
    dk.innerHTML=`<div class="card" id="cd"><div class="ph" id="ph" style="${ph[0]?`background-image:url('${esc(ph[0])}')`:''}">${ph[0]?'':'🛠'}${ph.length>1?`<div class="dots">${ph.map((_,i)=>`<i class="${i===0?'on':''}"></i>`).join('')}</div>`:''}</div>
    <div class="in"><h2 style="margin-bottom:6px">${esc(p.name)}</h2><span class="tag">${esc(p.trade)}</span><span class="tag">${esc(p.zone)}</span><span class="tag">${p.years||0} años</span>${p.rate?`<span class="tag">${esc(p.rate)}</span>`:''}
    <p style="margin:2px 0 6px">${stars(p.avg)}${p.n?` <span class="mu">(${p.n})</span>`:''}</p>
    ${[p.registered&&'De alta',p.insured&&'Con seguro',p.has_van&&'Furgoneta',p.own_tools&&'Herramienta propia'].filter(Boolean).map(t=>`<span class="tag b">${t}</span>`).join('')}
    <p class="mu" style="margin-top:4px">${esc((p.skills||[]).join(' · '))}</p><p style="margin-top:6px;font-size:14px">${esc((p.bio||'').slice(0,110))}</p></div>
    <div class="stamp l">ME INTERESA</div><div class="stamp n">PASO</div></div>`;
    const cd=$('#cd');let x0=null,dx=0;
    cd.onpointerdown=e=>{x0=e.clientX;cd.setPointerCapture(e.pointerId)};
    cd.onpointermove=e=>{if(x0===null)return;dx=e.clientX-x0;cd.style.transform=`translateX(${dx}px) rotate(${dx/20}deg)`;cd.querySelector('.l').style.opacity=Math.max(0,dx/100);cd.querySelector('.n').style.opacity=Math.max(0,-dx/100)};
    cd.onpointerup=()=>{if(x0===null)return;x0=null;
      if(Math.abs(dx)>100){const l=dx>0;cd.style.transition='transform .25s,opacity .25s';cd.style.transform=`translateX(${l?600:-600}px)`;cd.style.opacity=0;setTimeout(()=>act(l),220)}
      else{const tap=Math.abs(dx)<6;cd.style.transition='transform .2s';cd.style.transform='';cd.querySelector('.l').style.opacity=cd.querySelector('.n').style.opacity=0;setTimeout(()=>cd.style.transition='',200);
        if(tap&&ph.length>1){p.i=(p.i+1)%ph.length;$('#ph').style.backgroundImage=`url('${ph[p.i]}')`;$('#ph').querySelectorAll('.dots i').forEach((d,i)=>d.classList.toggle('on',i===p.i))}}dx=0};
  }
  $('#like').onclick=()=>act(true);$('#skip').onclick=()=>act(false);show();
}

async function contactos(){
  const {data=[]}=await sb.from('likes').select('*, profiles(name,trade,zone)').eq('company_id',S.user.id).order('created_at',{ascending:false});
  const rv=(await sb.from('reviews').select('autonomo_id').eq('company_id',S.user.id)).data||[];const done=new Set(rv.map(r=>r.autonomo_id));
  let html='<h2 style="margin-top:8px">Tus contactos</h2>';
  if(!data.length)html+=`<div class="box or"><h3>Aún no has marcado a nadie</h3><p class="mu">Ve a Buscar, mira los perfiles y pulsa Me interesa en los que te gusten. Cuando acepten, verás aquí su teléfono.</p></div>`;
  for(const l of data){const p=l.profiles||{};let ex='';
    if(l.status==='pending')ex='<p class="mu">Esperando respuesta…</p>';
    else if(l.status==='declined')ex='<p class="mu">No está disponible</p>';
    else{const ph=await getPhone(l.autonomo_id);ex=`<p><b>Teléfono:</b> ${ph?`<a href="tel:${esc(ph)}">${esc(ph)}</a>`:'<span class="mu">no lo ha puesto</span>'}</p>`;
      ex+=done.has(l.autonomo_id)?'<p class="mu">Ya lo has valorado.</p>':`<label>Cuando hayáis trabajado juntos, valóralo</label><div class="row"><select data-s="${l.autonomo_id}"><option value="5">5 ★</option><option value="4">4 ★</option><option value="3">3 ★</option><option value="2">2 ★</option><option value="1">1 ★</option></select><input data-c="${l.autonomo_id}" placeholder="Comentario"><button data-r="${l.autonomo_id}">Valorar</button></div>`}
    html+=`<div class="box"><h3>${esc(p.name)}</h3><span class="tag">${esc(p.trade)}</span><span class="tag">${esc(p.zone)}</span>${ex}</div>`}
  $('#v').innerHTML=html;
  $('#v').querySelectorAll('[data-r]').forEach(b=>b.onclick=async()=>{const id=b.dataset.r;
    const r=await sb.from('reviews').insert({company_id:S.user.id,autonomo_id:id,stars:+$(`[data-s="${id}"]`).value,comment:$(`[data-c="${id}"]`).value.trim()});
    if(r.error)return say(r.error.message);contactos()});
}
boot();
</script>
